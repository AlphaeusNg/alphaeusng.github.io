name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test site contracts
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check site contracts
        run: python3 tools/check_site.py
      - name: Compile Python tools
        run: python3 -m compileall -q tools
      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
