name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Check committed home utility CSS
        run: npm run test:styles
      - name: Test site contracts
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Test DCA calculation engine
        run: npm run test:dca
      - name: Check conviction data freshness
        run: python3 tools/finance/generate_conviction_history.py --check
      - name: Check sitemap freshness
        run: python3 tools/generate_sitemap.py --check
      - name: Check site contracts
        run: python3 tools/check_site.py
      - name: Install Chromium
        # GitHub-hosted runners already include Chrome's Linux libraries. Avoid
        # apt here so an unavailable Ubuntu mirror cannot block the entire job.
        run: npx playwright install chromium
      - name: Test browser interactions
        run: npm run test:browser
      - name: Compile Python tools
        run: python3 -m compileall -q tools
      - name: Check JavaScript syntax
        run: find . -path './node_modules' -prune -o -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
